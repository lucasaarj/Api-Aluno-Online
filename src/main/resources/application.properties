# Nome da aplicação
server.port=${PORT:8080}
spring.application.name=Aluno Online

# Conexão PostgreSQL: configure as variáveis no ambiente de execução
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Flyway: versionamento do esquema do banco
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

# Hibernate: valida o esquema gerenciado pelas migrations
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

# Ativar o endpoint de saúde
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=always
