services:
  postgres:
    image: postgres:15-alpine
    container_name: aluno-online-db

    environment:
      POSTGRES_DB: aluno_online
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
