services:
  # Banco de Dados
  db:
    image: postgres:15-alpine
    container_name: aluno-online-db
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d aluno_online"] # Tentar Conectar ao banco
      interval: 10s # Tenta a cada 10 segundos
      timeout: 5s # Espera até 5s pela resposta
      retries: 5 # Tenta 5 vezes antes de desistir
    networks:
      - aluno-online-network

  # Aplicação Java
  app:
    build: . # Indica que deve usar o Dockerfile da pasta atual
    container_name: aluno-online-api
    ports:
      - "8080:8080" # Mapeia a porta 8080 do PC para a 8080 do container
    depends_on:
      db:
        condition: service_healthy # a API sobe apenas quando o db estiver healthy
    environment:
      # Sobrescreve as configurações do application.properties
      - SPRING_DATASOURCE_URL=jdbc:postgresql://db:5432/${DB_NAME}
      - SPRING_DATASOURCE_USERNAME=${DB_USER}
      - SPRING_DATASOURCE_PASSWORD=${DB_PASSWORD}
    deploy:
      resources:
        limits:
          memory: 512M # Não deixa de passar de 512mb de RAM
          cpus: '0.50' # Usa no máximo 50% de um núcleo do processador
    networks:
      - aluno-online-network
    healthcheck:
        test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
        interval: 30s
        timeout: 10s
        retries: 3
volumes:
  postgres_data:

networks:
  aluno-online-network:
    driver: bridge
